[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sts2-damage-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.5"]

[project.scripts]
sts2-damage = "damage_model.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["damage_model*"]
